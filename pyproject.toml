[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py38"]
exclude = '''
/(
  \.venv
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py38"
# config optionnelle : select, ignore, extend-ignore, etc.
# ex: select = ["E", "F", "W", "C", "N"]