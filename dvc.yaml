stages:
  # Pipeline pour le dataset Roboflow Thermal Waste Detection
  ingest_roboflow:
    cmd: python src/thermal_sensors/scripts/ingest_roboflow_dataset.py --output-dir data/raw/roboflow --target-dir data/raw
    deps:
      - data/raw/roboflow
      - src/thermal_sensors/scripts/ingest_roboflow_dataset.py
    outs:
      - data/raw/roboflow_metadata.csv
      - data/raw/roboflow_statistics.json
  # Pipeline générique (fallback)
  ingest:
    cmd: python scripts/ingest.py data_src data/raw/data_raw.csv
    deps: []
    outs:
      - data/raw/data_raw.csv
  preprocess:
    cmd: python scripts/preprocess.py data/raw/roboflow_metadata.csv data/processed
    deps:
      - data/raw/roboflow_metadata.csv
      - data/raw/roboflow
      - src/thermal_sensors/scripts/preprocess.py
    outs:
      - data/processed/train
      - data/processed/validation
      - data/processed/test
      - data/processed/processed_metadata.csv
      - data/processed/preprocessing_stats.json
  train:
    cmd: python scripts/train.py --processed-data-dir data/processed --metadata data/processed/processed_metadata.csv --model-dir models/baseline
    deps:
      - data/processed/train
      - data/processed/validation
      - data/processed/processed_metadata.csv
      - src/thermal_sensors/models/baseline_model.py
      - src/thermal_sensors/data_generator.py
      - src/thermal_sensors/scripts/train.py
    outs:
      - models/baseline
